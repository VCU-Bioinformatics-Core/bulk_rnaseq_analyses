# bisrDE container image: build, smoke test, publish.
#
# Two images: bisrde-base holds the conda environment and the MSigDB gene sets
# (Dockerfile.base) and is tagged env-<hash of its inputs> by
# container_base_tag.sh; bisrde adds the bisrDE package and de.R on top of it
# (Dockerfile). The base is built only when no image with that tag exists in
# GHCR, so a release build takes minutes and does not contact Zenodo.
#
# Two outcomes, decided by the event:
#   pull request touching the image inputs  -> build + smoke test, nothing pushed
#   tag v* push                             -> build + smoke test, then push to
#                                              ghcr.io/<owner>/bisrde:<version>
#                                              and :latest; a base built in
#                                              this run is pushed as
#                                              bisrde-base:env-<hash> and :latest
#   manual dispatch                         -> build + smoke test; pushes only
#                                              when the publish input is ticked
#
# The smoke test always runs on the image before anything is pushed, so a tag
# never publishes an image that cannot analyse the bundled example.
#
# Dispatch with publish=true replaces the <version> and :latest images with
# whatever the chosen ref contains, and, when the ref changes the base inputs,
# also pushes a new bisrde-base:env-<hash> and moves bisrde-base:latest (the
# default FROM in the Dockerfile), so use it deliberately. It is needed once
# to publish 1.9.0: the v1.9.0 tag predates the Dockerfile, so run the
# workflow from main with publish ticked instead of re-tagging.
#
# One-time step after the first publish: packages are private by default.
# In the GitHub package settings for "bisrde" and for "bisrde-base" (Package
# settings -> Danger Zone -> Change visibility) make them public, so
# pull_container.sh can pull the image anonymously from the cluster, where
# nobody has a GitHub token, and so the base lookup below works without one.

name: container

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build (default: the default branch)"
        required: false
        default: ""
      publish:
        description: "Push the tested image to GHCR as <version> and latest (replaces existing tags)"
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - "differential_expression/Dockerfile"
      - "differential_expression/Dockerfile.base"
      - "differential_expression/container_base_tag.sh"
      - "differential_expression/.dockerignore"
      - "differential_expression/environment.yml"
      - "differential_expression/bisrDE/**"
      - "differential_expression/de.R"
      - "differential_expression/warm_msigdb_cache.R"
      - ".github/workflows/container.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    # The conda solve plus one example run normally take well under an hour;
    # the cap stops a stalled enrichment download from burning the 6 h default.
    timeout-minutes: 90
    env:
      PUBLISH: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # GHCR requires a lowercase repository path; the org name is not.
      - name: Image name and version
        id: info
        shell: bash
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bisrde" >> "$GITHUB_OUTPUT"
          base_tag=$(bash differential_expression/container_base_tag.sh)
          echo "base_tag=$base_tag" >> "$GITHUB_OUTPUT"
          echo "base_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bisrde-base:$base_tag" >> "$GITHUB_OUTPUT"
          version=$(awk '/^Version:/ {print $2}' differential_expression/bisrDE/DESCRIPTION)
          [ -n "$version" ] || { echo "::error::no Version field in bisrDE/DESCRIPTION"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bisrde, version $version, base tag $base_tag"

      - name: Tag must match bisrDE/DESCRIPTION
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "${{ steps.info.outputs.version }}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Version: ${{ steps.info.outputs.version }} in bisrDE/DESCRIPTION"
            exit 1
          fi

      # The docker driver builds against the local daemon, so an image built
      # earlier in this job (the base) is visible to a later FROM.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The inspect works anonymously once the package is public. On a pull
      # request run with a private or missing package the base is simply built
      # here (slow but correct) and never pushed. Any failed lookup, including a
      # transient registry error, counts as a missing base and triggers a build.
      - name: "Base image: reuse or build"
        id: base
        shell: bash
        env:
          BASE_IMAGE: ${{ steps.info.outputs.base_image }}
          BASE_TAG: ${{ steps.info.outputs.base_tag }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$BASE_IMAGE" >/dev/null 2>&1; then
            echo "reusing $BASE_IMAGE"
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "building $BASE_IMAGE"
            docker build -f differential_expression/Dockerfile.base \
              --build-arg BASE_TAG="$BASE_TAG" \
              -t "$BASE_IMAGE" differential_expression
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.info.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.info.outputs.version }}
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' }}
            type=match,pattern=v(.*),group=1

      # The docker driver leaves the image in the local daemon for the smoke
      # test. Nothing is pushed here. When the base was not built in this job,
      # the FROM line pulls it from GHCR.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: differential_expression
          file: differential_expression/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BISRDE_BASE=${{ steps.info.outputs.base_image }}
            BISRDE_VERSION=${{ steps.info.outputs.version }}

      - name: Smoke test on the bundled example
        shell: bash
        env:
          IMAGE: ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE" --help > /dev/null
          # Informational: quarto check exits 0 even when a dependency is
          # missing. The render inside the example run below is the real test.
          docker run --rm --entrypoint quarto "$IMAGE" check

          out="$RUNNER_TEMP/bisrde_ci_out"
          mkdir -p "$out" && chmod 777 "$out"
          docker run --rm \
            -v "$PWD/differential_expression/assets:/data:ro" \
            -v "$out:/out" \
            "$IMAGE" \
            --counts /data/example_counts.tsv \
            --samplesheet /data/example_samplesheet.csv \
            --outdir /out --runid ci \
            --annotation mouse --id-type ensembl \
            --include-contrasts cmtfa_vs_cmtf

          shopt -s nullglob
          reports=("$out"/rnaseq_analysis_*.html)
          if [ "${#reports[@]}" -ne 1 ]; then
            echo "::error::expected one rnaseq_analysis_*.html report, found ${#reports[@]}"
            ls -la "$out"
            exit 1
          fi
          summaries=("$out"/logs/*_report.json)
          if [ "${#summaries[@]}" -ne 1 ]; then
            echo "::error::expected one logs/*_report.json run summary, found ${#summaries[@]}"
            ls -la "$out/logs" || true
            exit 1
          fi
          if grep -q '"ok": false' "${summaries[0]}"; then
            echo "::error::a comparison produced no DE result (\"ok\": false in ${summaries[0]})"
            cat "${summaries[0]}"
            exit 1
          fi
          echo "smoke test passed: ${reports[0]}"

      # Push the exact image the smoke test ran, under every tag from the
      # metadata step. A base built in this job is pushed afterwards, under
      # its hashed tag and as :latest; a reused base is already in GHCR.
      - name: Push
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          BASE_IMAGE: ${{ steps.info.outputs.base_image }}
          BASE_BUILT: ${{ steps.base.outputs.built }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$TAGS"
          if [ "$BASE_BUILT" = "true" ]; then
            docker push "$BASE_IMAGE"
            latest="${BASE_IMAGE%:*}:latest"
            docker tag "$BASE_IMAGE" "$latest"
            docker push "$latest"
          fi
